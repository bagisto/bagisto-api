  "One withdrawal declaration with its evidence and timeline. Needs the `sales.eu_withdrawals.view` permission."
  adminEuWithdrawal(id: ID!): AdminEuWithdrawal

  "EU right-of-withdrawal declarations, newest first by default. Filters: `order_increment_id` and `customer_email` (partial match), `status` (received, refunded or declined), `channel_code`, and `received_at_from`/`_to` and `confirmation_sent_at_from`/`_to` dates. Sortable by id, received_at or status. `sort` names a column (or `column-asc`/`column-desc`) and `order` is `asc` or `desc` (default `desc`). Paginate with `first` (page size, default 10, max 50; 0 or less falls back to 10) and `after` (the previous page's `endCursor`, sent with the same `first`); `last` and `before` are not supported. Needs the `sales.eu_withdrawals` permission."
  adminEuWithdrawals(order_increment_id: String, customer_email: String, status: String, channel_code: String, received_at_from: String, received_at_to: String, confirmation_sent_at_from: String, confirmation_sent_at_to: String, sort: String, order: String, first: Int, after: String): AdminEuWithdrawalCursorConnection

