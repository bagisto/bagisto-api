  "One theme section by its IRI or numeric ID, with its published values, staged draft and the content of every locale. Needs the `appearance.sections` permission."
  adminAppearanceSection(id: ID!): AdminAppearanceSection

  "The editor field schema for the type of section `sectionId` and the options it holds in `locale`: staged edits when there are any, otherwise the published values. Needs the `appearance.sections` permission."
  adminAppearanceSectionFields(sectionId: Int!, locale: String): AdminAppearanceSectionFields

  "The sections of theme `code` that `channel` would draw if its staged edits were published: draft options, status and order applied, switched-off sections left out, footer links last. Needs the `appearance.sections` permission."
  adminAppearanceSectionPreview(code: String!, channel: Int, locale: String): AdminAppearanceSectionPreview

  "Every section of the theme `code` for one channel, as a plain list (not paginated), in sort order with the footer links section last. An unknown `channel` falls back to the current channel, and `locale` to one the channel runs. Needs the `appearance.sections` permission; an unknown theme is an error."
  adminAppearanceSections(code: String!, channel: Int, locale: String): [AdminAppearanceSection]

  "One theme from the gallery by its `code`, installed or not, with its status and the channels it is active on. Needs the `appearance.themes` permission."
  adminAppearanceTheme(code: String!): AdminAppearanceTheme

  "Which of `channelIds` already hold sections built for their current theme, and how many, so activating theme `code` there would replace them. Needs the `appearance.themes` permission."
  adminAppearanceThemeImpact(code: String!, channelIds: [Int!]!): AdminAppearanceThemeImpact

  "The theme gallery as a plain list (not paginated): every installed theme and every theme available to install, active themes first. Needs the `appearance.themes` permission."
  adminAppearanceThemes: [AdminAppearanceTheme]

