name: Pest Tests

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: pest-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  pest_tests:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.4']
        db:
          - connection: mysql
            label: MySQL 8.0
            image: mysql:8.0
            port: 3306
            user: root
            password: root
            health: mysqladmin ping
            php-ext: pdo_mysql

          - connection: mysql
            label: MySQL 8.4
            image: mysql:8.4
            port: 3306
            user: root
            password: root
            health: mysqladmin ping
            php-ext: pdo_mysql

          - connection: mysql
            label: MySQL 9.7
            image: mysql:9.7
            port: 3306
            user: root
            password: root
            health: mysqladmin ping
            php-ext: pdo_mysql

          - connection: mariadb
            label: MariaDB 10.11
            image: mariadb:10.11
            port: 3306
            user: root
            password: root
            health: healthcheck.sh --connect --innodb_initialized
            php-ext: pdo_mysql

          - connection: mariadb
            label: MariaDB 11.8
            image: mariadb:11.8
            port: 3306
            user: root
            password: root
            health: healthcheck.sh --connect --innodb_initialized
            php-ext: pdo_mysql

          - connection: mariadb
            label: MariaDB 12.3
            image: mariadb:12.3
            port: 3306
            user: root
            password: root
            health: healthcheck.sh --connect --innodb_initialized
            php-ext: pdo_mysql

          - connection: pgsql
            label: PostgreSQL 10
            image: postgres:10
            port: 5432
            user: postgres
            password: postgres
            health: pg_isready
            php-ext: pdo_pgsql

          - connection: pgsql
            label: PostgreSQL 14
            image: postgres:14
            port: 5432
            user: postgres
            password: postgres
            health: pg_isready
            php-ext: pdo_pgsql

          - connection: pgsql
            label: PostgreSQL 18
            image: postgres:18
            port: 5432
            user: postgres
            password: postgres
            health: pg_isready
            php-ext: pdo_pgsql

    name: PHP ${{ matrix.php-versions }} - ${{ matrix.db.label }}

    env:
      BAGISTO_VERSION: v2.5.0

    services:
      database:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_ROOT_PASSWORD: ${{ matrix.db.password }}
          MYSQL_DATABASE: bagisto
          MARIADB_ROOT_PASSWORD: ${{ matrix.db.password }}
          MARIADB_DATABASE: bagisto
          POSTGRES_USER: ${{ matrix.db.user }}
          POSTGRES_PASSWORD: ${{ matrix.db.password }}
          POSTGRES_DB: bagisto
        ports:
          - ${{ matrix.db.port }}
        options: --health-cmd="${{ matrix.db.health }}" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout bagisto-api plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Checkout Bagisto ${{ env.BAGISTO_VERSION }}
        uses: actions/checkout@v4
        with:
          repository: bagisto/bagisto
          ref: ${{ env.BAGISTO_VERSION }}
          path: bagisto

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: curl, fileinfo, gd, intl, mbstring, openssl, pdo, ${{ matrix.db.php-ext }}, tokenizer, zip
          ini-values: error_reporting=E_ALL, memory_limit=-1
          coverage: none
          tools: composer:v2

      - name: Install Bagisto composer dependencies
        working-directory: bagisto
        run: composer install --no-interaction --prefer-dist

      - name: Wire plugin into Bagisto via composer path repository
        working-directory: bagisto
        run: |
          # Install the package as a real directory rather than a symlink, which is how it is
          # installed everywhere else: a symlinked path repository leaves the autoloader and
          # Laravel's package discovery resolving the same classes through two paths.
          composer config repositories.bagisto-api '{"type": "path", "url": "../plugin", "options": {"symlink": false}}' --json
          composer require bagisto/bagisto-api:@dev --no-interaction --no-progress

      - name: Configure environment
        working-directory: bagisto
        run: |
          cp .env.example .env
          sed -i "s|^\(APP_ENV=\s*\).*$|\1testing|" .env
          sed -i "s|^\(APP_DEBUG=\s*\).*$|\1true|" .env
          sed -i "s|^\(DB_CONNECTION=\s*\).*$|\1${{ matrix.db.connection }}|" .env
          sed -i "s|^\(DB_HOST=\s*\).*$|\1127.0.0.1|" .env
          sed -i "s|^\(DB_PORT=\s*\).*$|\1${{ job.services.database.ports[matrix.db.port] }}|" .env
          sed -i "s|^\(DB_DATABASE=\s*\).*$|\1bagisto|" .env
          sed -i "s|^\(DB_USERNAME=\s*\).*$|\1${{ matrix.db.user }}|" .env
          sed -i "s|^\(DB_PASSWORD=\s*\).*$|\1${{ matrix.db.password }}|" .env
          # Laravel 13 reads CACHE_STORE; CACHE_DRIVER alone leaves the app cache on `file`,
          # which is where API_PLATFORM_CACHE keeps the metadata pool — one flush of the app
          # cache would then take the metadata of every parallel worker with it.
          grep -q '^CACHE_STORE=' .env && sed -i "s|^CACHE_STORE=.*|CACHE_STORE=array|" .env || echo "CACHE_STORE=array" >> .env
          grep -q '^CACHE_DRIVER=' .env && sed -i "s|^CACHE_DRIVER=.*|CACHE_DRIVER=array|" .env || echo "CACHE_DRIVER=array" >> .env
          grep -q '^SESSION_DRIVER=' .env && sed -i "s|^SESSION_DRIVER=.*|SESSION_DRIVER=array|" .env || echo "SESSION_DRIVER=array" >> .env
          grep -q '^QUEUE_CONNECTION=' .env && sed -i "s|^QUEUE_CONNECTION=.*|QUEUE_CONNECTION=sync|" .env || echo "QUEUE_CONNECTION=sync" >> .env
          grep -q '^API_PLATFORM_CACHE=' .env && sed -i "s|^API_PLATFORM_CACHE=.*|API_PLATFORM_CACHE=file|" .env || echo "API_PLATFORM_CACHE=file" >> .env
          cat .env

      - name: Run Bagisto installer
        working-directory: bagisto
        run: php artisan bagisto:install --no-interaction

      - name: Run Bagisto API Platform installer
        working-directory: bagisto
        run: php artisan bagisto-api-platform:install

      - name: Expose plugin Tests namespace to host autoloader
        working-directory: bagisto
        run: |
          php -r '
            $file = "composer.json";
            $json = json_decode(file_get_contents($file), true);
            $json["autoload-dev"]["psr-4"]["Webkul\\BagistoApi\\Tests\\"] = "vendor/bagisto/bagisto-api/tests/";
            file_put_contents($file, json_encode($json, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");
          '
          composer dump-autoload --no-interaction

      - name: Refresh package discovery and clear caches
        working-directory: bagisto
        run: |
          composer dump-autoload --no-interaction
          php artisan optimize:clear

      - name: Warm the API metadata cache
        working-directory: bagisto
        run: php artisan bagisto-api-platform:warm-cache

      - name: Run GraphQL APIs Pest (plugin suite)
        id: graphql_tests
        working-directory: bagisto
        continue-on-error: true
        run: vendor/bin/pest --parallel --processes=4 --colors=always vendor/bagisto/bagisto-api/tests/Feature/GraphQL

      - name: Run REST APIs Pest (plugin suite)
        id: rest_tests
        if: always()
        working-directory: bagisto
        continue-on-error: true
        run: vendor/bin/pest --parallel --processes=4 --colors=always vendor/bagisto/bagisto-api/tests/Feature/RestApi

      - name: Run Admin GraphQL APIs Pest (plugin suite)
        id: admin_graphql_tests
        if: always()
        working-directory: bagisto
        continue-on-error: true
        run: vendor/bin/pest --parallel --processes=4 --colors=always vendor/bagisto/bagisto-api/tests/Feature/Admin/GraphQL

      - name: Run Admin REST APIs Pest (plugin suite)
        id: admin_rest_tests
        if: always()
        working-directory: bagisto
        continue-on-error: true
        run: vendor/bin/pest --parallel --processes=4 --colors=always vendor/bagisto/bagisto-api/tests/Feature/Admin/RestApi

      - name: Run Admin audit and admin panel Pest (plugin suite)
        id: admin_web_tests
        if: always()
        working-directory: bagisto
        continue-on-error: true
        run: |
          status=0
          for dir in vendor/bagisto/bagisto-api/tests/Feature/Admin/Audit vendor/bagisto/bagisto-api/tests/Feature/Admin/Web; do
            vendor/bin/pest --parallel --processes=4 --colors=always "$dir" || status=1
          done
          exit $status

      - name: Run package-level Pest (plugin suite)
        id: package_tests
        if: always()
        working-directory: bagisto
        continue-on-error: true
        run: |
          status=0
          for file in vendor/bagisto/bagisto-api/tests/Feature/*Test.php; do
            [ "$(basename "$file")" = "SchemaExportTest.php" ] && continue
            vendor/bin/pest --colors=always "$file" || status=1
          done
          exit $status

      - name: Run schema export drift Pest (plugin suite)
        id: schema_tests
        if: always()
        working-directory: bagisto
        continue-on-error: true
        run: vendor/bin/pest --parallel --processes=4 --colors=always vendor/bagisto/bagisto-api/tests/Feature/SchemaExportTest.php

      - name: Suite results
        if: always()
        run: |
          echo "GraphQL:        ${{ steps.graphql_tests.outcome }}"
          echo "REST:           ${{ steps.rest_tests.outcome }}"
          echo "Admin GraphQL:  ${{ steps.admin_graphql_tests.outcome }}"
          echo "Admin REST:     ${{ steps.admin_rest_tests.outcome }}"
          echo "Admin Audit/Web: ${{ steps.admin_web_tests.outcome }}"
          echo "Package-level:  ${{ steps.package_tests.outcome }}"
          echo "Schema drift:   ${{ steps.schema_tests.outcome }}"

          if [ "${{ steps.graphql_tests.outcome }}" != "success" ] \
            || [ "${{ steps.rest_tests.outcome }}" != "success" ] \
            || [ "${{ steps.admin_graphql_tests.outcome }}" != "success" ] \
            || [ "${{ steps.admin_rest_tests.outcome }}" != "success" ] \
            || [ "${{ steps.admin_web_tests.outcome }}" != "success" ] \
            || [ "${{ steps.package_tests.outcome }}" != "success" ] \
            || [ "${{ steps.schema_tests.outcome }}" != "success" ]; then
            echo "::error::One or more Pest suites failed."
            exit 1
          fi
